<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo List</title>
<meta http-equiv="refresh" content="1; url=https://todo-list-navy-chi.vercel.app/">
<link rel="canonical" href="https://todo-list-navy-chi.vercel.app/">
<style>
  :root { --bg1:#eef0ff; --bg2:#fdf2f8; --card:rgba(255,255,255,.85); --text:#1c1f2e; --muted:#8b90a5; --accent:#6366f1; --accent2:#a855f7; --border:rgba(99,102,241,.12); }
  @media (prefers-color-scheme: dark) { :root { --bg1:#12132a; --bg2:#1f1230; --card:rgba(30,32,52,.85); --text:#eceefb; --muted:#8e93ae; --border:rgba(255,255,255,.08); } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text);
         background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed; font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { max-width:420px; width:100%; text-align:center; padding:32px 28px; background:var(--card); border:1px solid var(--border); border-radius:20px;
          box-shadow:0 20px 50px -20px rgba(79,70,229,.35); }
  h1 { margin:0 0 8px; font-size:28px; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { margin:0 0 20px; color:var(--muted); }
  .go { display:inline-block; padding:12px 24px; border-radius:12px; color:#fff; font-weight:600; text-decoration:none;
        background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 6px 16px -6px rgba(99,102,241,.7); }
  .alt { display:block; margin-top:18px; font-size:14px; color:var(--muted); }
  .alt a { color:var(--accent); }
</style>
</head>
<body>
<main class="card">
  <h1>My Tasks</h1>
  <p>Taking you to the sign-in page…</p>
  <a class="go" href="https://todo-list-navy-chi.vercel.app/">Sign in</a>
  <span class="alt">Not redirected? Use the button above.<br>Prefer no account? <a href="local.html">Use the browser-only version</a>.</span>
</main>
</body>
</html>
